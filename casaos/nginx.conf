server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index canli-yayinlar.html;

    # YouTube gömülü oynatıcısı (Error 153 olmaması için) sayfa adresini görmek istiyor
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Windows'a özel yardımcı dosyaları dışarı verme
    location ~* \.(ps1|bat|conf|yml|yaml|md)$ {
        return 404;
    }
}
